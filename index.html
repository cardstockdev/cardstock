<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardstock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6bff'/%3E%3Crect x='4.5' y='5' width='4' height='14' rx='1.3' fill='white'/%3E%3Crect x='10' y='5' width='4' height='8.5' rx='1.3' fill='white' opacity='.85'/%3E%3Crect x='15.5' y='5' width='4' height='11' rx='1.3' fill='white' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--bg:#e9edf3;--surface:#fff;--s2:#f3f5f9;--s3:#e4e8ef;--ink:#16202e;--ink2:#4a5668;--ink3:#7a8697;--line:#d9dfe8;
--accent:#2f6bff;--asoft:#e6eeff;--danger:#dc4b4b;--ok:#2f9e63;--warn:#e8a200;
--list:#eef1f6;--card:#fff;--cardshadow:0 1px 0 rgba(22,32,46,.14),0 1px 3px rgba(22,32,46,.10);
--chrome:#fff;--chrome-ink:#16202e;--chrome-line:#d9dfe8;--pop:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#0d131a;--surface:#17202a;--s2:#1e2935;--s3:#293645;--ink:#e8edf3;--ink2:#aebac8;--ink3:#7d8a9b;--line:#2b3846;--accent:#6190ff;--asoft:#1c2a4a;--list:#141c25;--card:#1f2a36;--cardshadow:0 1px 0 rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.35);--chrome:#121a23;--chrome-ink:#e8edf3;--chrome-line:#26323f;--pop:#1b2531;color-scheme:dark}
body.on-board{--chrome:rgba(8,14,22,.55);--chrome-ink:#fff;--chrome-line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:inherit}
svg.ic{flex:none;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
/* topbar */
#topbar{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);backdrop-filter:blur(14px);position:relative;z-index:30}
.tb{height:32px;min-width:32px;padding:0 9px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:550;color:inherit}
.tb:hover{background:rgba(127,138,155,.24)}
.tb.primary{background:var(--accent);color:#fff}.tb.primary:hover{filter:brightness(1.08)}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;padding:0 8px 0 4px}.brand svg{color:var(--accent)}
body.on-board .brand svg{color:#fff}
.grow{flex:1}
.search{position:relative;width:min(300px,30vw)}
.search svg{position:absolute;left:10px;top:8px;opacity:.7;pointer-events:none}
.search input{width:100%;height:32px;border:0;border-radius:8px;padding:0 10px 0 32px;background:rgba(127,138,155,.18);color:inherit;outline:0}
.search input::placeholder{color:inherit;opacity:.65}
.search input:focus{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.sresults{position:absolute;top:38px;left:0;width:max(100%,360px);background:var(--pop);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;max-height:60vh;overflow:auto}
.sr-h{font-size:12px;font-weight:650;color:var(--ink3);padding:8px 8px 4px}
.sr-i{display:flex;flex-direction:column;padding:7px 8px;border-radius:8px;cursor:pointer}
.sr-i:hover{background:var(--s2)}.sr-i small{color:var(--ink3)}.sr-empty{padding:14px;color:var(--ink3)}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:650;border:2px solid var(--card);margin-left:-6px;flex:none}
.av:first-child{margin-left:0}.av.lg{width:32px;height:32px;font-size:12px;border:0;margin-left:0}.av.me{border:0;margin:0;width:30px;height:30px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--s3);font-weight:550;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:var(--danger);color:#fff}.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}.btn.block{width:100%}
.icon-btn{width:28px;height:28px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:hover{background:rgba(127,138,155,.22)}
.row{display:flex;align-items:center;gap:8px}.row.between{justify-content:space-between}
.f{width:100%;background:var(--s2);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;outline:0}
.f:focus{border-color:var(--accent);background:var(--surface)}
textarea.f{resize:vertical;display:block}
/* home */
.home{height:100%;overflow:auto;padding:28px 24px 60px}
.home-in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:36px}
@media(max-width:900px){.home-in{grid-template-columns:1fr}}
.home h2{font-size:15px;font-weight:650;margin:0 0 12px;display:flex;gap:8px;align-items:center;color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:30px}
.tile{position:relative;height:96px;border-radius:12px;padding:10px 12px;color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tile:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.5))}
.tile>*{position:relative}.tile strong{font-weight:650;font-size:15px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile small{font-size:12px;opacity:.92}
.tile-star{position:absolute!important;right:6px;top:6px;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;opacity:0}
.tile:hover .tile-star,.tile-star.on{opacity:1}.tile-star.on svg{fill:#ffd33d;color:#ffd33d}
.tile-star:hover{background:rgba(0,0,0,.3)}
.tile.new{background:var(--s3);color:var(--ink2);align-items:center;justify-content:center;box-shadow:none;font-weight:600}.tile.new:before{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.up{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;cursor:pointer}.up:hover{background:var(--s2)}
.up small{color:var(--ink3)}.empty{padding:14px;color:var(--ink3)}
/* badges */
.bd{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:5px;font-size:12px}
.bd.overdue{background:var(--danger);color:#fff}.bd.soon{background:var(--warn);color:#2b2200}.bd.done,.bd.full{background:var(--ok);color:#fff}
/* board */
.bgl,.bgd{position:fixed;inset:0;z-index:0;pointer-events:none}
.bview{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.bh{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;flex-wrap:wrap}
.bh-title{font-size:18px;font-weight:700;padding:3px 10px;border-radius:8px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh-title:hover{background:rgba(0,0,0,.25)}
.bh-title-input{font-size:18px;font-weight:700;padding:3px 8px;border-radius:8px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);outline:0;width:260px;max-width:60vw}
.glass{height:32px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(10,16,24,.4);color:#fff;font-weight:550;backdrop-filter:blur(6px)}
.glass:hover{background:rgba(10,16,24,.58)}.glass.ico{width:32px;padding:0;justify-content:center}
.glass.on svg{fill:#ffd33d;color:#ffd33d}
.nbadge{background:#fff;color:#16202e;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
.seg{display:inline-flex;background:rgba(10,16,24,.4);border-radius:8px;padding:2px;backdrop-filter:blur(6px)}
.seg button{height:28px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:#fff;opacity:.88;font-weight:550}
.seg button.on{background:rgba(255,255,255,.96);color:#16202e;opacity:1}
.bh-mem{display:flex;cursor:pointer;padding:2px;border-radius:8px}.bh-mem:hover{background:rgba(0,0,0,.25)}.bh-mem .av{border-color:rgba(20,30,40,.9)}
.bbody{flex:1;min-height:0;position:relative}
.lists{height:100%;display:flex;gap:10px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:2px 14px 14px}
.list{flex:none;width:292px;max-height:100%;display:flex;flex-direction:column;background:var(--list);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.3);border-top:3px solid var(--lc,transparent);color:var(--ink)}
.list-head{display:flex;align-items:center;gap:4px;padding:7px 6px 5px 12px;cursor:grab}
.list-title{flex:1;font-weight:650;font-size:14px;padding:4px 0;cursor:pointer;overflow-wrap:anywhere}
.list-title-input{flex:1;min-width:0;font-weight:650;border:2px solid var(--accent);border-radius:6px;padding:3px 6px;background:var(--surface);outline:0}
.count{font-size:12px;color:var(--ink3);padding:1px 7px;border-radius:10px}
.list.over{box-shadow:0 0 0 2px var(--danger)}.list.over .count{background:var(--danger);color:#fff}
.list.collapsed{cursor:pointer}.list.collapsed:hover{filter:brightness(.97)}
.list.collapsed .list-head{cursor:pointer}
.vtitle{writing-mode:vertical-rl;font-weight:650;white-space:nowrap;max-height:240px;overflow:hidden}
.list-cards{overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:7px;min-height:8px}
.card{position:relative;background:var(--card);border-radius:9px;box-shadow:var(--cardshadow);cursor:pointer;overflow:hidden;border:1px solid transparent;flex:none;-webkit-touch-callout:none}
.card:hover{border-color:var(--accent)}
.card.done{opacity:.72}
.card-cover{height:30px}.card-cover.img{height:120px}
.card-body{padding:8px 10px 9px;position:relative}
.card-labels{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lbl{height:8px;min-width:38px;border-radius:5px;cursor:pointer}
.lbl.named{height:auto;min-width:0;padding:0 8px;font-size:12px;font-weight:600;line-height:20px}
.card-row{display:flex;align-items:flex-start}
.card-title{flex:1;overflow-wrap:anywhere;line-height:1.35}
.chk{flex:none;width:0;height:18px;overflow:hidden;opacity:0;margin-top:1px}
.chk span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink3);color:transparent}
.card:hover .chk,.chk.on{width:24px;opacity:1}.chk.on span{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:hover span{color:var(--ink3)}.chk.on:hover span{color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:6px;color:var(--ink2);font-size:12px}
.badges .bd{padding:1px 5px}.badges>.bd:not(.overdue):not(.soon):not(.done):not(.full):not(.work){padding-left:0;padding-right:0}
.card.cover-full{color:#fff}.card.cover-full .badges{color:inherit}
.card.cover-full .card-body{min-height:74px;display:flex;flex-direction:column;justify-content:flex-end}
.card.cover-full.img:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.7))}
.card.cover-full .av{border-color:rgba(0,0,0,.35)}
.avs{margin-left:auto;display:flex;padding-left:6px}
.card-edit{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:6px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);display:grid;place-items:center;color:var(--ink2);opacity:0;z-index:2}
.card:hover .card-edit{opacity:1}
body.compact .card-body{padding:5px 9px 6px}body.compact .list-cards{gap:5px}body.compact .card-cover.img{height:60px}
.card-ph{background:rgba(127,138,155,.28);border-radius:9px;flex:none}
.list-ph{flex:none;background:rgba(0,0,0,.28);border-radius:12px}
.ghost{box-shadow:0 14px 32px rgba(0,0,0,.4)!important;transform:rotate(2.5deg);cursor:grabbing;opacity:.97}
.drag-src{display:none!important}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.list-foot{display:flex}.add-card-btn{display:flex;align-items:center;gap:6px;flex:1;margin:4px 8px 8px;padding:6px 8px;border-radius:8px;color:var(--ink2)}
.add-card-btn:hover{background:rgba(127,138,155,.2)}
.hidden-note{font-size:12px;color:var(--ink3);padding:0 14px 8px}
.composer{padding:2px 8px 8px;display:flex;flex-direction:column;gap:8px}
.add-list-btn{flex:none;width:292px;height:42px;border-radius:12px;background:rgba(255,255,255,.3);color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 14px;backdrop-filter:blur(4px)}
.add-list-btn:hover{background:rgba(255,255,255,.4)}
.add-list{flex:none;width:292px;background:var(--list);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px}
.lists-tail{flex:none;width:1px}
/* drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer>header{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
.drawer>header h2{flex:1;font-size:15px;font-weight:650;text-align:center}
.drawer-body{flex:1;overflow:auto;padding:12px 14px 24px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px}
.menu-item:hover{background:var(--s2)}.menu-item.danger{color:var(--danger)}.menu-item small{color:var(--ink3);margin-left:auto}
.menu-item .mini{width:36px;height:24px;border-radius:5px;flex:none}
.sep{height:1px;background:var(--line);margin:8px 0}
.dh{font-size:12px;font-weight:650;color:var(--ink3);margin:14px 0 8px}
.bgg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg-tile{height:58px;border-radius:8px;border:2px solid transparent;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.bg-tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface) inset}
.bg-tile:hover{filter:brightness(1.08)}
.rng{display:flex;align-items:center;gap:10px;margin:6px 0}.rng span:first-child{width:44px;color:var(--ink2)}.rng input{flex:1}.rng span:last-child{width:28px;text-align:right;color:var(--ink3)}
.tog{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer;border-radius:8px}.tog:hover{background:var(--s2)}
.tab2{display:flex;gap:4px;background:var(--s2);border-radius:8px;padding:3px;margin-bottom:10px}.tab2 button{flex:1;text-align:center;padding:5px;border-radius:6px;font-weight:550}.tab2 .on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.arow{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}.arow span{flex:1;overflow-wrap:anywhere}
.act-i{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.act-i small{display:block;color:var(--ink3)}
.lrow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lbl-pick{flex:1;height:32px;border-radius:6px;padding:0 10px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.lbl-pick:hover{filter:brightness(1.08)}
/* modal */
#modal-root .overlay{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.62);overflow:auto;padding:32px 12px 48px;display:flex;justify-content:center;align-items:flex-start}
.modal{position:relative;width:min(780px,100%);background:var(--surface);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5);overflow:hidden}
.m-close{position:absolute;top:10px;right:10px;z-index:3;background:rgba(127,138,155,.18)}
.m-cover{height:120px}
.m-arch{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--warn);color:#2b2200}
.m-head{display:flex;gap:12px;padding:18px 48px 8px 18px;color:var(--ink2)}.m-head>div{flex:1}
.m-title{width:100%;font-size:20px;font-weight:700;color:var(--ink);border:2px solid transparent;border-radius:8px;background:transparent;padding:2px 8px;margin-left:-8px;resize:none;overflow:hidden;outline:0;line-height:1.3}
.m-title:hover{background:var(--s2)}.m-title:focus{background:var(--surface);border-color:var(--accent)}
.m-in{margin-top:2px;color:var(--ink3)}.m-in b{color:var(--ink2)}
.pill{display:inline-block;padding:0 8px;border-radius:9px;background:var(--ok);color:#fff;font-size:12px;font-weight:600;margin-left:6px}
.m-grid{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:20px;padding:6px 18px 22px}
@media(max-width:680px){.m-grid{grid-template-columns:1fr}}
.m-fields{display:flex;flex-wrap:wrap;gap:14px 20px;margin-bottom:14px;padding-left:32px}
.m-field h5,.m-side h5{font-size:12px;font-weight:650;color:var(--ink3);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip-add{width:32px;height:28px;border-radius:7px;background:var(--s3);display:grid;place-items:center}
.lblchip{height:28px;padding:0 12px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center}
.duechip{display:flex;align-items:center;gap:8px}.duechip input{width:16px;height:16px}
.duebtn{display:inline-flex;gap:6px;align-items:center;height:28px;padding:0 10px;border-radius:7px;background:var(--s3);font-weight:550}
.m-sec{margin-bottom:20px}
.m-sec-h{display:flex;align-items:center;gap:12px;margin-bottom:8px;color:var(--ink2)}.m-sec-h h3{font-size:16px;font-weight:650;color:var(--ink);flex:1}
.m-body{padding-left:32px}
.desc-empty{width:100%;min-height:64px;padding:10px;border-radius:8px;background:var(--s2);color:var(--ink2)}.desc-empty:hover{background:var(--s3)}
.md{cursor:pointer;line-height:1.55;overflow-wrap:anywhere}.md p{margin:0 0 6px}.md ul,.md ol{margin:0 0 6px;padding-left:22px}
.md code{background:var(--s3);padding:1px 5px;border-radius:4px;font-size:90%}.md pre{background:var(--s3);padding:10px;border-radius:8px;overflow:auto}
.md a{color:var(--accent)}.md h3,.md h4,.md h5{margin:8px 0 4px}
.hint{color:var(--ink3);font-size:12px}
.cl-bar{display:flex;align-items:center;gap:10px;margin:2px 0 8px}.cl-bar span{width:34px;font-size:12px;color:var(--ink3)}
.bar{flex:1;height:7px;border-radius:4px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}.bar.full i{background:var(--ok)}
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-radius:8px}.cl-item:hover{background:var(--s2)}
.cl-item .t{flex:1;cursor:text;overflow-wrap:anywhere}.cl-item.done .t{text-decoration:line-through;color:var(--ink3)}
.cl-item .icon-btn{opacity:0}.cl-item:hover .icon-btn{opacity:1}
.att{display:flex;gap:12px;align-items:center;padding:6px;border-radius:8px}.att:hover{background:var(--s2)}
.att-th{width:96px;height:68px;border-radius:7px;background:var(--s3) center/cover no-repeat;display:grid;place-items:center;color:var(--ink2);flex:none;cursor:pointer}
.att-i{flex:1;min-width:0}.att-i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att-i small{color:var(--ink3)}
.cm{display:flex;gap:10px;margin-bottom:12px}.cm>div{flex:1;min-width:0}.cm b{margin-right:6px}.cm small{color:var(--ink3)}

:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{scrollbar-width:thin;scrollbar-color:rgba(127,138,155,.5) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(127,138,155,.45);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(127,138,155,.7);background-clip:content-box}
.theme-fade,.theme-fade *{transition:background-color .35s,color .35s,border-color .35s,fill .35s!important}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes popin{0%{opacity:0;transform:scale(.9) translateY(6px)}60%{opacity:1;transform:scale(1.025)}100%{transform:none}}
@keyframes popin2{from{opacity:0;transform:translateY(-6px) scale(.96)}}
@keyframes popout{to{opacity:0;transform:translateY(-4px) scale(.97)}}
@keyframes modalin{from{opacity:0;transform:translateY(26px) scale(.965)}}
@keyframes modalout{to{opacity:0;transform:translateY(14px) scale(.975)}}
@keyframes toastin{from{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes slideout{to{transform:translateX(40px);opacity:0}}
@keyframes swapin{from{opacity:0;transform:translateX(18px)}}
@keyframes swapback{from{opacity:0;transform:translateX(-18px)}}
@keyframes dropin{0%{transform:scale(1.05) rotate(1.6deg);box-shadow:0 14px 26px rgba(0,0,0,.35)}100%{transform:none}}
@keyframes lift{from{transform:none;box-shadow:var(--cardshadow)}}
.tb,.btn,.icon-btn,.glass,.seg button,.side-btn,.menu-item,.ctx-i,.mrow,.th-item,.add-card-btn,.add-list-btn,.tog,.up,.sr-i,.bg-tile,.sw,.lbl-pick,.chip-add,.duebtn,.tab2 button,.tpl button{transition:background-color .15s,filter .15s,transform .15s var(--ease),box-shadow .2s,color .15s,opacity .15s,border-color .15s}
.btn:active,.tb:active,.glass:active,.side-btn:active,.icon-btn:active,.chip-add:active,.add-card-btn:active{transform:scale(.95)}
.btn.primary:hover,.tb.primary:hover{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.bg-tile:hover,.sw:hover,.lbl-pick:hover{transform:scale(1.05)}
.brand svg{transition:transform .35s var(--spring);overflow:visible}.brand svg rect{transform-box:fill-box;transform-origin:50% 100%}
.brand:hover svg{transform:rotate(-6deg) scale(1.1)}
.brand:hover svg rect:nth-child(1){animation:logobar .7s var(--spring) 0s both}.brand:hover svg rect:nth-child(2){animation:logobar .7s var(--spring) .09s both}.brand:hover svg rect:nth-child(3){animation:logobar .7s var(--spring) .18s both}
@keyframes logobar{0%{transform:scaleY(1)}25%{transform:scaleY(.45)}60%{transform:scaleY(1.18)}100%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.brand:hover svg rect{animation:none!important}}
.tile{transition:transform .22s var(--ease),box-shadow .22s}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.28)}.tile:active{transform:translateY(-1px) scale(.985)}
.tile-star,.tile-x,.card-edit,.cal-add,.cl-item .icon-btn,.cdel{transition:opacity .15s,background-color .15s,transform .15s}
.card{transition:transform .18s var(--ease),box-shadow .2s,border-color .15s,opacity .25s}
.card:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.2)}.card:active{transform:scale(.985)}
.chk{transition:width .2s var(--ease),opacity .15s}.chk span{transition:background-color .15s,border-color .15s,color .15s}
.chip,.cal-day{transition:background-color .15s,transform .15s var(--ease)}.chip:hover{transform:translateX(2px)}
.seg button.on{box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tbl tr[data-act] td{transition:background-color .15s}
.search{transition:width .28s var(--ease)}@media(min-width:701px){.search:focus-within{width:min(440px,42vw)}}
.f{transition:border-color .15s,background-color .15s,box-shadow .2s}
.f:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
.cl-item .t,.bar i{transition:color .2s,width .4s var(--ease)}
.count{transition:background-color .2s,color .2s}
.ghost{animation:lift .16s var(--ease)}
.card-ph,.list-ph,.tile-ph{animation:fadein .15s}
/* entrances: only while #main has .enter (set once per navigation) */
.enter .tile,.enter .panel,.enter .list,.enter .cal-wrap,.enter .tbl{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.enter .card{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + var(--ci,0)*40ms + 120ms)}
.enter .bh>*{animation:fadein .45s both}
.bbody.vswap{animation:rise .35s var(--ease)}
.card.pop-in,.list.pop-in{animation:popin .45s var(--spring)}
.card.dropped{animation:dropin .35s var(--spring)}
/* modal */
#modal-root .overlay{backdrop-filter:blur(3px)}
.overlay.opening{animation:fadein .2s}.overlay.opening .modal{animation:modalin .3s var(--spring)}
.overlay.closing{animation:fadeout .17s forwards;pointer-events:none}.overlay.closing .modal{animation:modalout .17s var(--ease) forwards}
/* popovers, menus, toasts */
.pop{transform-origin:50% 0}.pop.pop-in{animation:popin2 .2s var(--ease)}
.pop.pop-swap .pop-body{animation:swapin .2s var(--ease)}
.pop.pop-out{animation:popout .14s var(--ease) forwards;pointer-events:none}
#ctx-root .ctx{animation:popin2 .15s var(--ease);transform-origin:top left}
.sresults:not([hidden]){animation:popin2 .16s var(--ease)}
.toast{animation:toastin .32s var(--spring)}.toast.out{animation:toastout .2s var(--ease) forwards}
/* drawer */
.drawer.anim-in{animation:slide .28s var(--ease)}
.drawer.anim-swap .drawer-body{animation:swapin .22s var(--ease)}.drawer.anim-back .drawer-body{animation:swapback .22s var(--ease)}
.drawer.closing{animation:slideout .19s var(--ease) forwards;pointer-events:none}
/* accordions */
.acc-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 4px;font-weight:650;color:var(--ink2);border-radius:8px;transition:color .15s,background-color .15s}
.acc-h:hover{color:var(--ink);background:var(--s2)}
.acc-h>.ic:last-child{margin-left:auto;transition:transform .28s var(--ease)}.acc.open>.acc-h>.ic:last-child{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}.acc.open>.acc-b{grid-template-rows:1fr}
.acc-in{min-height:0;overflow:hidden;padding:3px;margin:-3px;opacity:0;transition:opacity .25s}.acc.open>.acc-b>.acc-in{opacity:1}
.m-acc{gap:12px;margin-bottom:6px;color:var(--ink2)}.m-acc h3{flex:0 1 auto;font-size:16px;font-weight:650;color:var(--ink)}
.side-acc>.acc-h,.m-side>.acc>.acc-h{font-size:12px;color:var(--ink3);padding:6px 2px}
.m-side-in{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
/* custom select dropdown */
.dd{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px;margin-top:4px;font-weight:400;cursor:pointer;text-align:left}
.dd .ic{opacity:.7;transition:transform .2s var(--ease)}.dd[aria-expanded=true]{border-color:var(--accent);background:var(--surface)}.dd[aria-expanded=true] .ic{transform:rotate(180deg)}
#dd-root .ddm{position:fixed;z-index:85;background:var(--pop);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.35);padding:4px;overflow:auto;max-height:260px;animation:popin2 .14s var(--ease);transform-origin:top}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:7px;font-weight:400}
.dd-opt:hover,.dd-opt.hl{background:var(--s2)}.dd-opt.on{color:var(--accent);font-weight:650}
/* calendar month jump */
.cal-title{display:flex;align-items:center;gap:4px;margin-right:auto;padding:2px 8px;border-radius:8px}.cal-title:hover{background:var(--s2)}.cal-title h2{margin:0!important}
.cal-title .ic{opacity:.7}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mgrid button{padding:9px 0;text-align:center;border-radius:8px;font-weight:550;background:var(--s2);transition:background-color .15s,transform .15s var(--ease)}
.mgrid button:hover{background:var(--s3);transform:scale(1.04)}.mgrid .on{background:var(--accent);color:#fff}.mgrid .now:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ===== chat polish ===== */
.chat{transform-origin:bottom right;transition:height .34s var(--ease),width .34s var(--ease),box-shadow .2s}
.chat.chat-opening{animation:chatin .4s var(--spring)}
.chat.chat-closing{animation:chatout .2s var(--ease) forwards;pointer-events:none}
@keyframes chatin{from{opacity:0;transform:translateY(28px) scale(.88)}}
@keyframes chatout{to{opacity:0;transform:translateY(20px) scale(.92)}}
.chat.min{height:45px;width:240px}
.chat>:not(header){transition:opacity .25s .12s}
.chat.min>:not(header){opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s,visibility 0s .34s}
.chat>header .icon-btn svg{transition:transform .3s var(--ease)}
.cmsg.msg-in{animation:msgin .32s var(--ease)}
.cmsg.own.msg-in{transform-origin:left bottom;animation:msgown .42s var(--spring)}
.cmsg.own.msg-in .ctext{animation:bubflash .8s ease-out}
.cl-sys.msg-in{animation:fadein .45s}
.cmsg.msg-out{animation:msgdel .2s var(--ease) forwards}
@keyframes msgin{from{opacity:0;transform:translateX(-14px)}}
@keyframes msgown{0%{opacity:0;transform:translateY(16px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes bubflash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes msgdel{to{opacity:0;transform:scale(.9) translateX(10px)}}
.chat-in{position:relative}
.chat-in .btn.primary{transition:opacity .2s,transform .15s var(--ease),filter .2s,box-shadow .2s}
.chat-in .btn.idle{opacity:.55;filter:saturate(.6)}
.chat-in .btn.sent{animation:sendpulse .42s var(--spring)}
@keyframes sendpulse{0%{transform:scale(1)}35%{transform:scale(.86)}70%{transform:scale(1.09)}100%{transform:none}}
.fly{position:absolute;right:30px;bottom:12px;color:var(--accent);pointer-events:none;animation:fly .65s var(--ease) forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(-45deg) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(26px,-58px) rotate(-45deg) scale(1.2)}}
.shake{animation:shake .32s}@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ep-grid button{transition:transform .12s var(--ease),background-color .15s}.ep-grid button:hover{transform:scale(1.28)}
.ep-tabs button{transition:background-color .15s,box-shadow .2s,transform .15s var(--ease)}.ep-tabs button:hover{transform:translateY(-1px)}
.chat-panel.ep-in{animation:upin .22s var(--ease)}
@keyframes upin{from{opacity:0;transform:translateY(10px)}}
.chat-new:not([hidden]){animation:upin .25s var(--ease)}

/* ===== list drop + horizontal view menu ===== */
@keyframes listdrop{0%{transform:scale(1.035) rotate(1.4deg);box-shadow:0 18px 34px rgba(0,0,0,.4)}55%{transform:scale(.99)}100%{transform:none}}
.list.dropped{animation:listdrop .45s var(--spring)}
.list.dropped .card{animation:rise .35s var(--ease) both;animation-delay:calc(var(--ci,0)*30ms + 80ms)}
.vmenu{display:inline-flex;align-items:center;background:rgba(10,16,24,.4);border-radius:8px;padding:2px;backdrop-filter:blur(6px)}
.vtrig{height:28px;padding:0 8px 0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:550;background:rgba(255,255,255,.96);color:#16202e;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .15s var(--ease)}
.vtrig:active{transform:scale(.95)}
.vtrig .ic:last-child{transition:transform .32s var(--ease)}.vmenu.open .vtrig .ic:last-child{transform:rotate(180deg)}
.vopts{display:grid;grid-template-columns:0fr;transition:grid-template-columns .32s var(--ease)}.vmenu.open .vopts{grid-template-columns:1fr}
.vopts-in{min-width:0;overflow:hidden;display:flex;gap:2px;opacity:0;visibility:hidden;transition:opacity .15s,visibility 0s .32s}
.vmenu.open .vopts-in{opacity:1;visibility:visible;padding-left:2px;transition:opacity .22s .08s,visibility 0s}
.vopts-in button{height:28px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:550;white-space:nowrap;opacity:.9;transition:background-color .15s,transform .15s var(--ease)}
.vopts-in button:hover{background:rgba(255,255,255,.2);opacity:1}.vopts-in button:active{transform:scale(.94)}
@media(max-width:700px){.vmenu span{display:none}}

/* tile drag smoothness, emoji images */
.tile-ph{animation:none}
body.dragging #all-tiles .tile,body.dragging #all-tiles .tile:hover{transition:none}
body.dragging #all-tiles .tile:hover{transform:none;box-shadow:0 1px 2px rgba(0,0,0,.2)}
img.emoji{width:1.25em;height:1.25em;vertical-align:-.28em;margin:0 .04em;display:inline-block;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.ep-grid button img.emoji,.ep-tabs button img.emoji{display:block;margin:auto;vertical-align:baseline}

/* chat file uploads */
.cfile{display:flex;align-items:center;gap:10px;margin-top:4px;padding:8px 10px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--cardshadow)}
.cmsg.own .cfile{background:var(--asoft);border-color:transparent;box-shadow:none}
.cfile .fi{flex:none;width:34px;height:34px;border-radius:8px;background:var(--s2);color:var(--ink2);display:grid;place-items:center}
.cfile .fm{flex:1;min-width:0}.cfile .fn{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfile .fs{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;margin-top:1px}
.cfile .fbar{height:4px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:5px}
.cfile .fbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .15s linear}
.cfile.done .fs{color:#22a06b}.cfile.fail .fs,.cfile.cancel .fs{color:#e5484d}.cfile.gone .fs{color:var(--ink3)}
.cfile .icon-btn,.cfile a.icon-btn{flex:none;color:var(--ink2);text-decoration:none;display:grid;place-items:center}
.chat-prev .fpv{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.chat-prev .fpv b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.chat-prev .fpv small{color:var(--ink3)}

/* custom emoji */
img.cemo{height:1.55em;width:auto;max-width:3em;vertical-align:-.42em;margin:0 1px;object-fit:contain}
.ep-grid button img.cemo{height:26px;max-width:30px;display:block;margin:auto;vertical-align:baseline}
.ce-bar{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line)}.ce-bar .hint{margin:0 0 0 auto;font-size:11px}
.ce-list{flex:1;overflow:auto;padding:4px 8px;display:flex;flex-direction:column;gap:4px}
.ce-row{display:flex;align-items:center;gap:6px}.ce-row img.cemo{height:26px;max-width:30px;flex:none;margin:0}.ce-row .f{flex:1;min-width:0;height:28px;padding:0 8px}.ce-row .nm{color:var(--ink3)}
.ce-empty{padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}

/* ===== list collapse animation ===== */
.list-chev{display:inline-flex;flex:none;width:0;margin-right:-4px;opacity:0;overflow:hidden;color:var(--ink3);transition:width .3s var(--ease),margin .3s var(--ease),opacity .25s}
.list.collapsed .list-chev{width:16px;margin-right:0;opacity:1}
.list-fold{display:flex;flex-direction:column;min-height:0;flex:0 1 auto}
.list.collapsed:not(.anim) .list-fold{display:none}
.list.collapsed .list-title{pointer-events:none}
.vo-fold svg{transition:transform .3s var(--ease)}.list:not(.collapsed) .vo-fold svg{transform:rotate(180deg)}
/* ===== checklist items: reorder + rename ===== */
.cl-items{display:flex;flex-direction:column;min-height:6px}
.cl-item{gap:4px;align-items:flex-start;position:relative}
.cl-item input[type=checkbox]{margin:6px 4px 0 2px;width:16px;height:16px;flex:none}
.cl-item .t{flex:1;min-width:0;padding:3px 8px;border:1.5px solid transparent;border-radius:6px;line-height:1.4}
.cl-item .cl-edit{flex:1;min-width:0;width:auto;display:block;resize:none;overflow:hidden;padding:3px 8px;border:1.5px solid var(--accent);border-radius:6px;background:var(--surface);font:inherit;line-height:1.4;margin:0}
.cl-item .icon-btn{flex:none}
.cl-grip{flex:none;width:18px;height:28px;display:grid;place-items:center;color:var(--ink3);cursor:grab;opacity:0;border-radius:6px;touch-action:none;-webkit-user-select:none;user-select:none}
.cl-item:hover .cl-grip,.cl-grip:focus-visible,.cl-item.editing .cl-grip{opacity:1}
@media(hover:none){.cl-grip{opacity:.55}}
.cl-grip:hover{background:var(--s3);color:var(--ink)}
.cl-src{display:none!important}
.cl-ph{border-radius:8px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);margin:2px 0;box-sizing:border-box;flex:none}
.cl-ghost{display:flex;align-items:flex-start;gap:4px;padding:5px 4px;border-radius:8px;background:var(--surface);color:var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.35);transform:rotate(.6deg);cursor:grabbing}
.cl-ghost .cl-grip{opacity:1}.cl-ghost .icon-btn{opacity:0}
body.cl-dragging,body.cl-dragging *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
.cl-item.dropped{animation:dropin .35s var(--spring)}
.m-sec-h .cl-title-in{flex:1;min-width:0;width:auto;font-size:16px;font-weight:650;padding:4px 8px;color:var(--ink)}
/* ===== view-only mode ===== */
body.viewonly .add-card-btn,body.viewonly .add-list-btn,body.viewonly .add-list,body.viewonly .card-edit,body.viewonly .cal-add,body.viewonly .m-side,body.viewonly .chip-add,body.viewonly [data-act=att-cover],body.viewonly [data-act=att-del],body.viewonly .m-arch .btn,body.viewonly .desc-empty{display:none!important}
body.viewonly .m-grid{grid-template-columns:minmax(0,1fr)}
body.viewonly .list-head{cursor:default}body.viewonly .list.collapsed .list-head{cursor:pointer}
.vo-note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* ===== members: search + roles ===== */
.mem-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mem-search{position:relative}.mem-search>.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}.mem-search .f{padding-left:32px}
.mem-share{padding:8px 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line)}.mem-share .tog{padding:0;align-items:flex-start}.mem-share .tog:hover{background:none}.mem-share input{margin-top:3px}
.mrow{flex-wrap:wrap}
.role-seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px;gap:2px;flex:none}
.role-seg button{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.role-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.role-badge{font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--ink2);flex:none}.role-badge.ed{background:var(--asoft);color:var(--accent)}
/* ===== chat: view-only people can read but not type ===== */
.chat-ro{padding:7px 12px;font-size:12px;color:var(--ink3);background:var(--surface);border-top:1px solid var(--line);text-align:center}
.chat.ro .chat-in{opacity:.5}.chat.ro .chat-in *{cursor:not-allowed}
#tb-chat .av{width:22px;height:22px;font-size:10px;margin:0}
/* grouped chat messages (same sender in a row) */
.cmsg{position:relative}
.cmsg.cont{margin-top:-6px}
.cmsg.cont>.av{visibility:hidden;height:0}
.cmsg.cont .cmeta{position:absolute;right:0;top:4px;margin:0}
.cmsg.cont .cmeta b,.cmsg.cont .cmeta small{display:none}
.cmsg.cont .ctext{margin-top:0}
/* chat replies, video, board emoji */
.creply{display:flex;gap:6px;align-items:baseline;max-width:100%;margin-top:3px;padding:3px 8px;border-left:3px solid var(--accent);background:rgba(127,138,155,.14);border-radius:6px;font-size:12px;color:var(--ink2);cursor:pointer;overflow:hidden}
.creply:hover{background:rgba(127,138,155,.24)}.creply b{color:var(--ink);font-weight:650;flex:none}
.creply span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cdel~.cdel{margin-left:0}
.cmsg.flash .ctext,.cmsg.flash .cfile,.cmsg.flash .cimg{animation:rflash 1.3s ease-out}
@keyframes rflash{0%,35%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}

.vp:not(.playing) .vp-bar,.vp:hover .vp-bar,.vp:focus-within .vp-bar,.vp.show .vp-bar{opacity:1;transform:none}

.vp-t{flex:none;min-width:2.8em;text-align:center;color:var(--ink2)}
.vp-seek{flex:1;min-width:0;height:16px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;--p:0%}
.vp-seek:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.vp-seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--s3) var(--p))}

.vp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* ===== dates ===== */
const DAY=864e5,pad=n=>String(n).padStart(2,'0');
const dKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const inDate=ts=>dKey(new Date(ts)),inTime=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fromInputs=(d,t)=>{if(!d)return null;const[y,m,da]=d.split('-').map(Number),[h,mi]=(t||'17:00').split(':').map(Number);return new Date(y,m-1,da,h||0,mi||0).getTime()};
const fmtDay=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtFull=ts=>new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const startOfMonth=d=>new Date(d.getFullYear(),d.getMonth(),1);
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' hr ago';if(s<604800)return Math.floor(s/86400)+' d ago';return fmtDay(ts)}
function dueState(c){if(!c.due)return null;if(c.done)return 'done';const d=c.due-Date.now();return d<0?'overdue':d<DAY?'soon':'later'}
function parseQuickDate(tok){tok=tok.toLowerCase();const n=new Date(),base=new Date(n.getFullYear(),n.getMonth(),n.getDate(),17,0).getTime();
if(tok==='today')return base;if(tok==='tomorrow'||tok==='tmrw')return base+DAY;if(tok==='nextweek')return base+7*DAY;
let m=tok.match(/^\+(\d+)d$/);if(m)return base+m[1]*DAY;
const days=['sun','mon','tue','wed','thu','fri','sat'];const i=days.indexOf(tok.slice(0,3));
if(i>-1&&/^[a-z]{3,9}$/.test(tok)){return base+((i-n.getDay()+7)%7||7)*DAY}
m=tok.match(/^(\d{1,2})\/(\d{1,2})$/);if(m){const d=new Date(n.getFullYear(),m[1]-1,m[2],17,0);if(d<n-DAY)d.setFullYear(d.getFullYear()+1);return d.getTime()}return null}

/* ===== markdown-lite ===== */
function mdInline(t){return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>')
.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function md(src){const blocks=[];let s=esc(src).replace(/```([\s\S]*?)```/g,(m,c)=>{blocks.push(`<pre><code>${c.replace(/^\n/,'')}</code></pre>`);return '\u0000'+(blocks.length-1)+'\u0000'});
const out=[];let list=null;const close=()=>{if(list){out.push(`</${list}>`);list=null}};
for(const line of s.split('\n')){let m;
if(m=line.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+mdInline(m[1])+'</li>');continue}
if(m=line.match(/^\s*\d+\.\s+(.*)/)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+mdInline(m[1])+'</li>');continue}
close();if(m=line.match(/^(#{1,3})\s+(.*)/))out.push(`<h${m[1].length+2}>${mdInline(m[2])}</h${m[1].length+2}>`);else if(line.trim())out.push('<p>'+mdInline(line)+'</p>')}
close();return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i])}

function matches(b,c){const f=ui.filter;
if(f.q){const q=f.q.toLowerCase();if(!(c.title.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||lblOf(b,c).some(l=>l.name.toLowerCase().includes(q))))return false}
if(f.labels.length&&!f.labels.some(id=>id==='__none'?!c.labels.length:c.labels.includes(id)))return false;
if(f.members.length&&!f.members.some(id=>id==='__none'?!c.members.length:c.members.includes(id)))return false;
if(f.due){const ds=dueState(c);
if(f.due==='none'&&c.due)return false;
if(f.due==='overdue'&&ds!=='overdue')return false;
if(f.due==='soon'&&(!c.due||c.done||c.due-Date.now()>7*DAY))return false;
if(f.due==='done'&&!c.done)return false;
if(f.due==='open'&&c.done)return false;
if(f.due==='working'&&!(c.working&&c.working.length&&!c.done))return false}
return true}

/* collapse / expand a list with a smooth height animation (the DOM is updated in place instead of re-rendering) */
function foldList(id,want){const b=B(),l=b&&b.lists.find(x=>x.id===id);if(!l)return;
 const collapse=want==null?!l.collapsed:!!want;if(!!l.collapsed===collapse)return;

 const el=$(`.list[data-list="${id}"]`);
 if(!el||REDUCE()||b.view!=='board'||typeof el.animate!=='function'){render();return}
 const head=el.querySelector('.list-head'),fold=el.querySelector('.list-fold'),from=el.getBoundingClientRect().height;
 el.getAnimations().forEach(a=>a.cancel());if(fold)fold.getAnimations().forEach(a=>a.cancel());
 const tok=el._ft=(el._ft||0)+1;
 el.classList.add('anim');el.classList.toggle('collapsed',collapse);
 if(collapse)el.setAttribute('data-act','toggle-collapse');else el.removeAttribute('data-act');
 const t=el.querySelector('.list-title-input');if(t)t.blur();
 const bw=el.offsetHeight-el.clientHeight,to=collapse?head.offsetHeight+bw:el.offsetHeight;
 el.style.overflow='hidden';
 const a=el.animate([{height:from+'px'},{height:to+'px'}],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'});
 if(fold)fold.animate(collapse?[{opacity:1},{opacity:0}]:[{opacity:0},{opacity:1}],{duration:collapse?200:300,delay:collapse?0:70,easing:'ease',fill:'both'});
 a.onfinish=()=>{if(el._ft!==tok)return;el.classList.remove('anim');el.style.overflow='';if(fold)fold.getAnimations().forEach(x=>x.cancel())}}

 let cls='card'+(c.done?' done':'')+(c.working&&c.working.length&&!c.done?' working':'')+(seen.b===b.id&&!c.archived&&!seen.c.has(c.id)?' pop-in':'')+(ui.dropped===c.id?' dropped':''),style='',top='';

 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dKey(d),ts=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();

 const P=Array.from({length:90},()=>{const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,s=5+Math.random()*9;return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.5,c:cols[(Math.random()*cols.length)|0],life:0,max:70+Math.random()*40}});

  for(const p of P){p.life++;if(p.life>p.max)continue;alive++;p.vx*=.985;p.vy=p.vy*.985+.32;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;

function runSearch(q){const box=$('#sresults');q=q.trim().toLowerCase();if(!q){box.hidden=true;return}
 const bs=S.order.map(i=>S.boards[i]).filter(b=>b.title.toLowerCase().includes(q)).slice(0,4),cs=[];
 for(const id of S.order){const b=S.boards[id];for(const l of b.lists)for(const c of l.cards){if(c.archived||l.archived)continue;if(c.title.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q))cs.push({b,l,c})}}
 let h='';if(bs.length)h+=`<div class="sr-h">Boards</div>`+bs.map(b=>`<div class="sr-i" data-act="search-go" data-board="${b.id}">${esc(b.title)}</div>`).join('');

/* voice */
function getCtx(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();return actx}
function watchLevel(id,stream){stopWatch(id);try{const c=getCtx(),src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=256;src.connect(an);levels[id]={src,an,buf:new Uint8Array(an.frequencyBinCount),speaking:false}}catch(e){}}
function stopWatch(id){const w=levels[id];if(w){try{w.src.disconnect()}catch(e){}delete levels[id]}}
setInterval(()=>{let ch=false;for(const id in levels){const w=levels[id];w.an.getByteTimeDomainData(w.buf);let mx=0;for(const x of w.buf)mx=Math.max(mx,Math.abs(x-128));const sp=mx>9;if(sp!==w.speaking){w.speaking=sp;ch=true}}if(ch)chatRefresh()},150);
function applyMic(){const v=mp.voice;if(!v)return;const on=!v.muted&&(!S.settings.ptt||v.talking);v.stream.getAudioTracks().forEach(t=>t.enabled=on);chatRefresh()}
/* Voice is connect-on-join: you only hear people while you are in voice yourself.
   Whoever joins calls the people already in voice; both directions share one call. */
/* calls are set up through the connection server; after a network blip the peer can be
   cut off from it even though data channels still work, so make sure it is back first */
function sigReady(){const pr=mp.peer;if(!pr||pr.destroyed)return Promise.resolve(false);if(!pr.disconnected)return Promise.resolve(true);
 return new Promise(ok=>{let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(t);try{pr.off('open',on)}catch(e){}ok(v)};const on=()=>fin(true);pr.on('open',on);const t=setTimeout(()=>fin(!pr.disconnected),6000);try{pr.reconnect()}catch(e){}})}
function voiceCall(id,tries){tries=tries||0;const v=mp.voice,pr=mp.peers[id];if(!v||!mp.peer||v.calls[id]||!(pr&&pr.voice))return;
 try{const call=mp.peer.call(id,v.stream,{metadata:{voice:true}});if(!call)return;v.calls[id]=call;
  call.on('stream',s=>{call._got=true;attachAudio(id,s,call)});
  call.on('close',()=>{if(mp.voice&&mp.voice.calls[id]===call)delete mp.voice.calls[id];dropAudio(id,call)});call.on('error',()=>{});
  /* if the call never connects (stale route, dropped signalling), try again a couple of times */
  setTimeout(()=>{if(mp.voice!==v||v.calls[id]!==call||call._got||tries>=2)return;try{call.close()}catch(e){}if(v.calls[id]===call)delete v.calls[id];sigReady().then(()=>voiceCall(id,tries+1))},8000)}catch(e){}}
function attachAudio(id,stream,call){let a=audioEls[id];if(!a){a=audioEls[id]=document.createElement('audio');a.autoplay=true;audioRoot.append(a)}a._call=call;a.srcObject=stream;a.play().catch(()=>{});watchLevel(id,stream);chatRefresh()}
function dropAudio(id,call){const a=audioEls[id];if(call&&a&&a._call&&a._call!==call)return;if(a){a.srcObject=null;a.remove();delete audioEls[id]}stopWatch(id);chatRefresh()}
function voiceDrop(id){dropAudio(id);const v=mp.voice;if(v&&v.calls[id]){try{v.calls[id].close()}catch(e){}delete v.calls[id]}}
function mpOnCall(call){const v=mp.voice;if(!v){try{call.close()}catch(e){}return}
 try{const oc=v.calls[call.peer];if(oc&&oc!==call)oc.close()}catch(e){}call.answer(v.stream);v.calls[call.peer]=call;call.on('stream',s=>{call._got=true;attachAudio(call.peer,s,call)});call.on('close',()=>{if(mp.voice&&mp.voice.calls[call.peer]===call)delete mp.voice.calls[call.peer];dropAudio(call.peer,call)});call.on('error',()=>{})}
let voiceBusy=false;
async function voiceStart(){if(mp.voice||voiceBusy)return;if(mp.status!=='live'){toast(mp.status==='connecting'?'Still connecting. Try again in a moment.':'Join the session first to use voice.');return}voiceBusy=true;try{await voiceStart2()}finally{voiceBusy=false}}
async function voiceStart2(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Voice chat needs a microphone and a secure page (https or localhost).');return}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}catch(e){toast('Could not access the microphone');return}
 if(mp.status!=='live'||mp.voice){stream.getTracks().forEach(t=>t.stop());return}
 const sig=await sigReady();if(mp.status!=='live'||mp.voice){stream.getTracks().forEach(t=>t.stop());return}if(!sig)toast('Lost contact with the connection server. Retrying voice…');
 mp.voice={stream,calls:{},muted:false,talking:false};try{getCtx().resume()}catch(e){}vcJoinSound();
 watchLevel('me',stream);applyMic();mpSend({t:'voice',on:true});Object.keys(mp.peers).forEach(voiceCall);chatSys('You joined voice');mpUpdate()}
function voiceStop(silent){const v=mp.voice;if(!v)return;mp.voice=null;if(!silent)vcLeaveSound();Object.values(v.calls).forEach(c=>{try{c.close()}catch(e){}});v.stream.getTracks().forEach(t=>t.stop());stopWatch('me');if(mp.peer){mpSend({t:'voice',on:false});chatSys('You left voice')}chatRefresh();updateLiveBtn()}
function voiceReset(){voiceStop(true);Object.keys(audioEls).forEach(dropAudio)}

 if(c){try{c.send({t:'kick',from:mp.peer.id})}catch(e){}delete mp.conns[id];setTimeout(()=>{try{c.close()}catch(e){}},400)}

function acFind(q){q=q.toLowerCase();const cu=cemoAll().map(x=>x.name).filter(n=>n.includes(q)).sort((a,b)=>b.startsWith(q)-a.startsWith(q)).slice(0,4).map(n=>'c:'+n);return cu.concat(acFindB(q)).slice(0,8)}
function acFindB(q){const a=[],b=[];for(const k of EMO_KEYS){if(k===q)a.unshift(k);else if(k.startsWith(q))a.push(k);else if(k.includes(q))b.push(k)}

 return{title:'Jump to month',w:260,body:`<div class="row between" style="margin-bottom:8px"><button class="icon-btn" data-act="cp-year" data-d="-1" aria-label="Previous year">${ic('chevL')}</button><b>${y}</b><button class="icon-btn" data-act="cp-year" data-d="1" aria-label="Next year">${ic('chevR')}</button></div><div class="mgrid">${mn.map((n,i)=>`<button class="${cur.getFullYear()===y&&cur.getMonth()===i?'on':''}${now.getFullYear()===y&&now.getMonth()===i?' now':''}" data-act="cp-month" data-m="${i}">${n}</button>`).join('')}</div>`}}
A['pop-calpick']=el=>openPop('calpick',el);
A['cp-year']=el=>{pop.cy+=+el.dataset.d;renderPop()};
A['cp-month']=el=>{ui.calMonth=new Date(pop.cy,+el.dataset.m,1);ui.vfx=1;closePop();renderBoardView()};

/* chat: open / close, send juice */
function chatShow(on){clearTimeout(chatShow.t);
 if(on){chatEl.hidden=false;chatEl.classList.remove('chat-closing');if(!REDUCE()){chatEl.classList.remove('chat-opening');void chatEl.offsetWidth;chatEl.classList.add('chat-opening')}return}
 if(chatEl.hidden)return;if(REDUCE()){chatEl.hidden=true;return}
 chatEl.classList.remove('chat-opening');chatEl.classList.add('chat-closing');
 chatShow.t=setTimeout(()=>{chatEl.classList.remove('chat-closing');if(!ui.chatOpen)chatEl.hidden=true},200)}
function chatSendState(){const b=$('[data-act="chat-send"]',chatEl),i=$('#chat-input');if(b&&i)b.classList.toggle('idle',!i.value.trim()&&!chatPending)}
function chatSendFx(){chatSendState();if(REDUCE())return;const row=$('.chat-in',chatEl),btn=$('[data-act="chat-send"]',chatEl);
 if(btn){btn.classList.remove('sent');void btn.offsetWidth;btn.classList.add('sent')}
 if(row){const f=document.createElement('span');f.className='fly';f.innerHTML=ic('arrow',16);row.append(f);setTimeout(()=>f.remove(),700)}}
function chatShake(){const i=$('#chat-input');if(!i||REDUCE())return;i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake')}
chatEl.addEventListener('input',e=>{if(e.target.id==='chat-input')chatSendState()});
chatSendState();

/* view switcher: horizontal dropdown */
function vClose(){ui.vopen=false;const m=$('.vmenu',main);if(m){m.classList.remove('open');const t=$('.vtrig',m);if(t)t.setAttribute('aria-expanded','false')}}
A.vtoggle=el=>{const m=el.closest('.vmenu'),o=!m.classList.contains('open');m.classList.toggle('open',o);el.setAttribute('aria-expanded',o);ui.vopen=o};
const _view=A.view;
A.view=el=>{if(ui.vopen&&!REDUCE()){vClose();setTimeout(()=>_view(el),190)}else{ui.vopen=false;_view(el)}};
document.addEventListener('pointerdown',e=>{if(ui.vopen&&!e.target.closest('.vmenu'))vClose()},true);
document.addEventListener('keydown',e=>{if(ui.vopen&&e.key==='Escape'){e.stopImmediatePropagation();vClose()}},true);

/* ===== favicon follows the theme ===== */
let _favAcc='';
function updateFavicon(){let acc=(getComputedStyle(document.documentElement).getPropertyValue('--accent')||'').trim();if(!/^#[0-9a-f]{3,6}$/i.test(acc))acc='#2f6bff';
 if(acc===_favAcc)return;_favAcc=acc;const[r,g,b]=hex2(acc),bars=(0.299*r+0.587*g+0.114*b)/255>0.72?'#16202e':'#ffffff';
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='${acc}'/><rect x='4.5' y='5' width='4' height='14' rx='1.3' fill='${bars}'/><rect x='10' y='5' width='4' height='8.5' rx='1.3' fill='${bars}' opacity='.85'/><rect x='15.5' y='5' width='4' height='11' rx='1.3' fill='${bars}' opacity='.7'/></svg>`;
 const l=document.createElement('link');l.rel='icon';l.type='image/svg+xml';l.href='data:image/svg+xml,'+encodeURIComponent(svg);const old=document.querySelector('link[rel~="icon"]');if(old)old.replaceWith(l);else document.head.append(l)}

/* ===== Discord-style emoji: Twemoji artwork (what Discord uses), swapped in for the system emoji ===== */
const EMO_RE=/[\u{1F1E6}-\u{1F1FF}]{2}|\p{Extended_Pictographic}(?:\uFE0F|[\u{1F3FB}-\u{1F3FF}])?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F|[\u{1F3FB}-\u{1F3FF}])?)*/gu;
const EMO_QUICK=/[\u{1F1E6}-\u{1F1FF}]|\p{Extended_Pictographic}/u;
const twUrl=e=>{let cp=[...e].map(c=>c.codePointAt(0).toString(16));if(!e.includes('\u200d'))cp=cp.filter(x=>x!=='fe0f');return 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/'+cp.join('-')+'.svg'};
const emoWanted=m=>m.includes('\uFE0F')||m.includes('\u200D')||m.codePointAt(0)>=0x2300;
function emojiFrag(t){EMO_RE.lastIndex=0;let last=0,m,frag=null;
 while((m=EMO_RE.exec(t))){if(!emoWanted(m[0]))continue;frag=frag||document.createDocumentFragment();if(m.index>last)frag.append(t.slice(last,m.index));
  const im=document.createElement('img');im.className='emoji';im.alt=m[0];im.draggable=false;im.src=twUrl(m[0]);
  im.onerror=()=>{const sp=document.createElement('span');sp.className='noemo';sp.textContent=im.alt;im.replaceWith(sp)};frag.append(im);last=m.index+m[0].length}
 if(!frag)return null;if(last<t.length)frag.append(t.slice(last));return frag}
const emoSkip=p=>!p||!p.closest||!!p.closest('textarea,script,style,.noemo,[contenteditable]');
function emojiText(n){if(emoSkip(n.parentNode)||!EMO_QUICK.test(n.nodeValue))return;const f=emojiFrag(n.nodeValue);if(f)n.replaceWith(f)}
function emojify(root){if(!root)return;if(root.nodeType===3){emojiText(root);return}
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];while(w.nextNode())list.push(w.currentNode);list.forEach(emojiText)}

/* ===== init ===== */
$$('[data-ico]').forEach(e=>{e.outerHTML=ic(e.dataset.ico)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='auto')render()});
ui.enter=true;ui.boardId=parseHash();render();
if(ui.boardId)S.recent=[ui.boardId,...S.recent.filter(x=>x!==ui.boardId)];
setTimeout(()=>{try{mpAutoShare()}catch(e){}},0);

/* ===== What's new =====
   NOTE TO FUTURE CLAUDE (and any other editor): every time you change this file, you MUST update this section:
   1. Bump APP_VERSION below (increase by 1 for each edited version; it should match the file's number, e.g. cardstock_33 -> '33').
   2. Add a new entry at the TOP of WHATS_NEW with that version, today's date, and a short, plain-language list of what you changed.
   3. Keep ALL older entries below it, never delete them: the popup lists them under "Older updates" so people can read past notes.
   The popup shows automatically once per user when APP_VERSION differs from the last version they have seen. */
const APP_VERSION='49';
const WHATS_NEW=[

 ]},
 {v:'46',date:'2026-10-16',changes:[

 {v:'44',date:'2026-10-16',changes:[

 ]},
 {v:'43',date:'2026-10-16',changes:[

 {v:'42',date:'2026-10-16',changes:[

 {v:'41',date:'2026-10-16',changes:[

 {v:'40',date:'2026-10-16',changes:[

function showWhatsNew(){
 const root=$('#wn-root');if(!root||root.firstChild)return;
 const cur=WHATS_NEW.find(e=>e.v===APP_VERSION)||WHATS_NEW[0];if(!cur)return;const older=WHATS_NEW.filter(e=>e!==cur);
 root.innerHTML=`<div class="wn-ov"><div class="wn" role="dialog" aria-modal="true" aria-label="What's new"><div class="wn-head"><h2>What\'s new</h2><span class="wn-ver">Version ${esc(cur.v)} \u00b7 ${esc(cur.date)}</span></div><div class="wn-body">${cur.changes.length?`<ul>${cur.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}${older.length?`<h3 class="wn-sub">Older updates</h3><div class=\"wn-list\">${older.map(e=>`<div class=\"wn-old\"><button class=\"wn-old-h\" aria-expanded=\"false\">${ic('chevD',14)}<span>Version ${esc(e.v)}</span><small>${esc(e.date)}</small></button><div class=\"wn-old-b\"><div class=\"wn-old-in\"><ul>${e.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></div></div>`).join('')}</div>`:''}</div><div class="wn-foot"><button class="btn primary" id="wn-ok">Got it</button></div></div></div>`;
 const close=()=>{document.removeEventListener('keydown',onKey,true);root.innerHTML='';try{localStorage.setItem('cardstock.whatsnew',APP_VERSION)}catch(e){}};
 const onKey=e=>{if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();close()}};
 document.addEventListener('keydown',onKey,true);
 $('#wn-ok').onclick=close;
 $$('.wn-old-h',root).forEach(h=>h.onclick=()=>{const o=h.parentNode,on=!o.classList.contains('open');o.classList.toggle('open',on);h.setAttribute('aria-expanded',on)});
 $('.wn-ov',root).addEventListener('mousedown',e=>{if(e.target===e.currentTarget)close()});
 $('#wn-ok').focus();
}
try{if(localStorage.getItem('cardstock.whatsnew')!==APP_VERSION)setTimeout(showWhatsNew,300)}catch(e){setTimeout(showWhatsNew,300)}

emojify(document.body);
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.isConnected&&(n.nodeType===1||n.nodeType===3))emojify(n)}}).observe(document.body,{childList:true,subtree:true});
